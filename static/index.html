<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediAssist AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef3f8;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app {
      width: 100%;
      max-width: 640px;
      height: 92vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #0f766e;
      color: #fff;
      padding: 16px 20px;
    }
    header h1 { font-size: 1.15rem; }
    header p { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f8fafc;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.45;
      font-size: 0.95rem;
      word-wrap: break-word;
    }
    .bot { background: #e2e8f0; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; }
    .user { background: #0f766e; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .error { background: #fee2e2; color: #991b1b; align-self: flex-start; }
    .typing { font-style: italic; opacity: 0.7; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; background: #f8fafc; }
    .chip {
      border: 1px solid #0f766e;
      color: #0f766e;
      background: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .chip:hover { background: #0f766e; color: #fff; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e2e8f0; }
    input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: #0f766e; }
    button.send {
      background: #0f766e;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button.send:disabled { opacity: 0.5; cursor: not-allowed; }
    .note { font-size: 0.72rem; color: #64748b; text-align: center; padding: 0 12px 10px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>MediAssist AI</h1>
      <p>Ask about doctors, departments, services and hospital info</p>
    </header>

    <div id="chat"></div>

    <div class="chips" id="chips">
      <button class="chip">Which doctors are in cardiology?</button>
      <button class="chip">What are the visiting hours?</button>
      <button class="chip">What services do you offer?</button>
    </div>

    <form id="form">
      <input id="input" type="text" placeholder="Type your question..." autocomplete="off">
      <button class="send" id="sendBtn" type="submit">Send</button>
    </form>
    <p class="note">I am an assistant, not a doctor. In an emergency, go to the emergency department or call your local emergency number.</p>
  </div>

  <script>
    let sessionId = null;

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const chips = document.getElementById("chips");

    // Make bot text safe, then show **bold** and bullet points nicely
    function formatText(text) {
      const safe = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      return safe
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^\s*[\*\-]\s+/gm, "• ")
        .replace(/\n/g, "<br>");
    }

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      if (type === "bot") {
        div.innerHTML = formatText(text);
      } else {
        div.textContent = text;
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage(text) {
      addMessage(text, "user");
      chips.style.display = "none";
      input.value = "";
      sendBtn.disabled = true;

      const typing = addMessage("Thinking...", "bot typing");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });

        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          addMessage(data.detail || "Something went wrong. Please try again.", "error");
        } else {
          sessionId = data.session_id;
          addMessage(data.reply, "bot");
        }
      } catch (err) {
        typing.remove();
        addMessage("Cannot reach the server. Is it running?", "error");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (text) sendMessage(text);
    });

    chips.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => sendMessage(chip.textContent));
    });

    addMessage("Hello! I'm MediAssist AI. How can I help you today?", "bot");
  </script>
</body>
</html>
