<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Staff Login - MediAssist AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef3f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      padding: 28px;
    }
    h1 { font-size: 1.3rem; color: #0f766e; }
    p.sub { font-size: 0.85rem; color: #64748b; margin: 4px 0 20px; }
    label { display: block; font-size: 0.85rem; color: #334155; margin: 12px 0 4px; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: #0f766e; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #0f766e;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #error { color: #991b1b; font-size: 0.85rem; margin-top: 12px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Staff Login</h1>
    <p class="sub">MediAssist AI - authorised staff only</p>

    <form id="form">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="btn" type="submit">Log in</button>
      <p id="error"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const errorBox = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.textContent = "";
      btn.disabled = true;

      try {
        const response = await fetch("/staff/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await response.json();

        if (response.ok) {
          window.location.href = "/staff";
        } else {
          errorBox.textContent = data.detail || "Login failed.";
        }
      } catch (err) {
        errorBox.textContent = "Cannot reach the server.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
